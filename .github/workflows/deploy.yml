name: Deploy to Cloud Run

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker asia-northeast3-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        run: |
          docker build --platform linux/amd64 -t asia-northeast3-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID}}/scorenow-repo/scorenow-api:${{ github.sha }} -t asia-northeast3-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID}}/scorenow-repo/scorenow-api:latest .
          docker push asia-northeast3-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID}}/scorenow-repo/scorenow-api:${{ github.sha }}
          docker push asia-northeast3-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID}}/scorenow-repo/scorenow-api:latest

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: scorenow-api
          region: asia-northeast3
          image: asia-northeast3-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/scorenow-repo/scorenow-api:${{ github.sha }}




