spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:3306/scorenow?useSSL=false&serverTimezone=Asia/Seoul&preserveInstants=false&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  data:
    mongodb:
      uri: ${MONGODB_URI}
    redis:
      host: ${REDIS_HOST}
      port: 6380

  cache:
    type: redis
    redis:
      time-to-live: 600000

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

  cloud:
    aws:
      s3:
        bucket: ${S3_BUCKET}
      credentials:
        access-key: ${AWS_ACCESS_KEY}
        secret-key: ${AWS_SECRET_KEY}
      region:
        static: ap-northeast-2
        auto: false
      stack:
        auto: false

logging:
  level:
    org.hibernate.SQL: OFF

betsapi:
  base-url: https://api.b365api.com
  token: ${BETSAPI_TOKEN}
  connect-timeout: 30
  read-timeout: 30

jwt:
  secret : ${JWT_SECRET}

# 개발 관리자 페이지 Firebase 주소 (환경변수 관리는 Cloud Run 에서 처리)
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
